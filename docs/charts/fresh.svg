<rect class="bg" width="760" height="353" rx="10"/><text class="h" x="16" y="26">A new file: time until it can be found</text><text class="m" x="16" y="44">AntiFind follows changes live; plocate needs updatedb; find reads the disk each time. Log scale.</text><rect class="b1" x="190" y="52" width="10" height="10" rx="2"/><text class="m" x="204" y="61">AntiFind</text><rect class="b2" x="282" y="52" width="10" height="10" rx="2"/><text class="m" x="296" y="61">plocate (updatedb, then search)</text><rect class="b4" x="535" y="52" width="10" height="10" rx="2"/><text class="m" x="549" y="61">GNU find (one search)</text><line class="g" x1="190.0" y1="68" x2="190.0" y2="323"/><text class="m" x="190.0" y="339" text-anchor="middle">1 ms</text><line class="g" x1="301.7" y1="68" x2="301.7" y2="323"/><text class="m" x="301.7" y="339" text-anchor="middle">10 ms</text><line class="g" x1="413.4" y1="68" x2="413.4" y2="323"/><text class="m" x="413.4" y="339" text-anchor="middle">100 ms</text><line class="g" x1="525.0" y1="68" x2="525.0" y2="323"/><text class="m" x="525.0" y="339" text-anchor="middle">1 s</text><line class="g" x1="636.7" y1="68" x2="636.7" y2="323"/><text class="m" x="636.7" y="339" text-anchor="middle">10 s</text><line class="g" x1="690.0" y1="68" x2="690.0" y2="323"/><text class="m" x="690.0" y="339" text-anchor="middle">30 s (cap)</text><text class="t" x="16" y="94">10 M files, btrfs loop</text><path class="b1" d="M190 74 h125.4 a4 4 0 0 1 4 4 v1 a4 4 0 0 1 -4 4 h-125.4 z"><title>AntiFind: 14 ms</title></path><text class="v" x="324.4" y="82">14 ms</text><path class="b2" d="M190 85 h470.3 a4 4 0 0 1 4 4 v1 a4 4 0 0 1 -4 4 h-470.3 z"><title>plocate (updatedb, then search): 17.6 s</title></path><text class="v" x="669.3" y="93">17.6 s</text><path class="b4" d="M190 96 h463.6 a4 4 0 0 1 4 4 v1 a4 4 0 0 1 -4 4 h-463.6 z"><title>GNU find (one search): 15.4 s</title></path><text class="v" x="662.6" y="104">15.4 s</text><text class="t" x="16" y="145">/home, btrfs</text><t