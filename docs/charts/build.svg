<rect class="bg" width="760" height="298" rx="10"/><text class="h" x="16" y="26">Building the index, cold cache</text><text class="m" x="16" y="44">Wall time from start until searches can be answered. Shorter is faster; log scale.</text><rect class="b1" x="190" y="52" width="10" height="10" rx="2"/><text class="m" x="204" y="61">AntiFind (first start)</text><rect class="b2" x="380" y="52" width="10" height="10" rx="2"/><text class="m" x="394" y="61">plocate updatedb</text><line class="g" x1="190.0" y1="68" x2="190.0" y2="268"/><text class="m" x="190.0" y="284" text-anchor="middle">100 ms</text><line class="g" x1="391.8" y1="68" x2="391.8" y2="268"/><text class="m" x="391.8" y="284" text-anchor="middle">1 s</text><line class="g" x1="593.7" y1="68" x2="593.7" y2="268"/><text class="m" x="593.7" y="284" text-anchor="middle">10 s</text><line class="g" x1="690.0" y1="68" x2="690.0" y2="268"/><text class="m" x="690.0" y="284" text-anchor="middle">30 s (cap)</text><text class="t" x="16" y="89">10 M files, btrfs loop</text><path class="b1" d="M190 74 h389.5 a4 4 0 0 1 4 4 v1 a4 4 0 0 1 -4 4 h-389.5 z"><title>AntiFind (first start): 8.9 s</title></path><text class="v" x="588.5" y="82">8.9 s</text><path class="b2" d="M190 85 h496.0 a4 4 0 0 1 4 4 v1 a4 4 0 0 1 -4 4 h-496.0 z"><title>plocate updatedb: > 30 s</title></path><text class="v" x="695.0" y="93">> 30 s</text><text class="t" x="16" y="129">/home, btrfs</text><path class="b1" d="M190 114 h446.2 a4 4 0 0 1 4 4 v1 a4 4 0 0 1 -4 4 h-446.2 z"><title>AntiFind (first start): 17.0 s</title></path><text class="v" x="645.2" y="122">17.0 s</text><path class="b2" d="M190 125 h496.0 a4 4 0 0 1 4 4 v1 a4 4 0 0 1 -4 4 h-496.0 z"><title>plocate updatedb: > 30 s</title></path><text class="v" x="695.0" y="133">> 30 s</text><text class="t" x="16" y="169">/, btrfs</text><path class="b1" d="M190 154 h309.0 a4 4 0 0 1 4 4 v1 a4 4 0 0 1 -4 4 h-309.0 z"><title>AntiFind (first start): 3.6 s</title></path><text class="v" x="508.0" y="162">3.6 s